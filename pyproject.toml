[project]
name = "bms-log-agent"
version = "0.1.0"
description = "BMS log analysis agent with deterministic rules and bounded model tools"
requires-python = ">=3.11"
dependencies = [
    "openai>=1.0",
    "agents>=0.0.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
]

[project.scripts]
bms-agent = "bms_agent.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bms_agent*"]
