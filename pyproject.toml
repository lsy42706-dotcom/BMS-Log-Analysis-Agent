[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "bms-log-agent"
version = "0.2.0"
description = "BYOK BMS log analysis agent with evidence-backed local tools"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
agent = ["openai-agents==0.23.1"]

[project.scripts]
bms-log-agent = "bms_agent.cli:main"
bms-log-web = "bms_agent.web:main"

[tool.setuptools.packages.find]
include = ["bms_agent*"]

[tool.setuptools.package-data]
bms_agent = ["web_assets/*"]
